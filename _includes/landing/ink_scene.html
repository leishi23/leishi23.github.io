<!-- Decorative ink-wash (水墨) scene behind the About section:
     a bamboo grove by a stream, with a bamboo raft poled by a figure in a conical hat.
     Composed as a wide, shallow band (like a handscroll) anchored to the section's
     lower edge. Hand-authored SVG + CSS animation. Purely decorative -> aria-hidden. -->
<div class="ink-scene" aria-hidden="true">
  <svg class="ink-scene__svg" viewBox="0 0 1200 440" preserveAspectRatio="xMidYMax meet" role="presentation" focusable="false">
    <defs>
      <!-- wet ink bleed: roughen edges then soften, like ink sinking into rice paper -->
      <filter id="inkBleed" x="-12%" y="-12%" width="124%" height="124%">
        <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="4" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
        <feGaussianBlur stdDeviation="0.45"/>
      </filter>
      <!-- broad, watery wash for distant forms -->
      <filter id="inkWash" x="-25%" y="-25%" width="150%" height="150%">
        <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="3" seed="3" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="12" xChannelSelector="R" yChannelSelector="G"/>
        <feGaussianBlur stdDeviation="5"/>
      </filter>
      <filter id="mistBlur" x="-30%" y="-60%" width="160%" height="220%">
        <feGaussianBlur stdDeviation="11"/>
      </filter>

      <!-- a single bamboo leaf: tapered lens shape, like one brush press -->
      <path id="leaf" d="M0 0 Q 24 -8 56 -3 Q 26 6 0 0 Z"/>

      <!-- fade out toward the top so the prose above stays clean -->
      <linearGradient id="fadeUp" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%"   stop-color="#fff" stop-opacity="1"/>
        <stop offset="62%"  stop-color="#fff" stop-opacity=".8"/>
        <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
      </linearGradient>
      <mask id="sceneMask">
        <rect x="0" y="0" width="1200" height="440" fill="url(#fadeUp)"/>
      </mask>
    </defs>

    <g mask="url(#sceneMask)">
      <!-- ── distant mountains: pale, watery ─────────────────────────── -->
      <g class="ink-far" filter="url(#inkWash)">
        <path d="M-40 150 C 110 86, 200 128, 300 100 C 396 74, 448 118, 540 132 L 540 200 L -40 200 Z"/>
        <path d="M500 142 C 620 90, 686 126, 792 104 C 908 80, 990 128, 1240 114 L 1240 200 L 500 200 Z" opacity=".68"/>
      </g>

      <!-- ── drifting mist bands ─────────────────────────────────────── -->
      <g class="ink-mist" filter="url(#mistBlur)">
        <ellipse class="ink-mist__band ink-mist__band--1" cx="300" cy="172" rx="400" ry="12"/>
        <ellipse class="ink-mist__band ink-mist__band--2" cx="880" cy="188" rx="340" ry="10"/>
        <ellipse class="ink-mist__band ink-mist__band--3" cx="600" cy="206" rx="500" ry="9"/>
      </g>

      <!-- ── the stream ──────────────────────────────────────────────── -->
      <g class="ink-water">
        <path class="ink-water__body" d="M-40 236 C 240 222, 520 248, 760 234 C 980 222, 1120 240, 1240 232 L 1240 440 L -40 440 Z" filter="url(#inkWash)"/>
        <g class="ink-water__lines" filter="url(#inkBleed)">
          <path class="ink-ripple ink-ripple--1" d="M70 268 C 160 262, 220 274, 310 267"/>
          <path class="ink-ripple ink-ripple--2" d="M390 286 C 480 279, 570 292, 668 284"/>
          <path class="ink-ripple ink-ripple--3" d="M746 272 C 846 265, 934 278, 1052 269"/>
          <path class="ink-ripple ink-ripple--4" d="M120 322 C 250 314, 358 328, 476 319"/>
          <path class="ink-ripple ink-ripple--5" d="M604 348 C 732 340, 850 354, 986 344"/>
          <path class="ink-ripple ink-ripple--6" d="M180 384 C 340 375, 500 390, 676 379"/>
          <path class="ink-ripple ink-ripple--7" d="M770 408 C 890 400, 1010 413, 1150 403"/>
        </g>
      </g>

      <!-- ── bamboo grove, left cluster (rises out of the frame) ─────── -->
      <g class="ink-bamboo ink-bamboo--left" filter="url(#inkBleed)">
        <g class="ink-culm">
          <path d="M96 440 C 90 320, 86 180, 100 -10 L 114 -10 C 104 180, 106 320, 110 440 Z"/>
          <g class="ink-node"><rect x="92" y="196" width="20" height="3.5" rx="1.75"/><rect x="94" y="116" width="19" height="3.5" rx="1.75"/><rect x="97" y="48" width="18" height="3.5" rx="1.75"/></g>
          <g class="ink-leaves ink-leaves--a">
            <use href="#leaf" transform="translate(110 54) rotate(-28)"/>
            <use href="#leaf" transform="translate(110 62) rotate(8) scale(.86)"/>
            <use href="#leaf" transform="translate(106 50) rotate(-54) scale(.78)"/>
          </g>
          <g class="ink-leaves ink-leaves--b">
            <use href="#leaf" transform="translate(99 124) rotate(196) scale(.88)"/>
            <use href="#leaf" transform="translate(99 117) rotate(158) scale(.76)"/>
          </g>
        </g>
        <g class="ink-culm" opacity=".7">
          <path d="M152 440 C 148 340, 146 230, 156 40 L 166 40 C 159 230, 161 340, 164 440 Z"/>
          <g class="ink-node"><rect x="148" y="224" width="16" height="3" rx="1.5"/><rect x="150" y="142" width="15" height="3" rx="1.5"/></g>
          <g class="ink-leaves ink-leaves--c">
            <use href="#leaf" transform="translate(163 74) rotate(-16) scale(.8)"/>
            <use href="#leaf" transform="translate(163 83) rotate(26) scale(.7)"/>
          </g>
          <g class="ink-leaves ink-leaves--d">
            <use href="#leaf" transform="translate(153 160) rotate(202) scale(.76)"/>
          </g>
        </g>
        <g class="ink-culm" opacity=".82">
          <path d="M42 440 C 38 348, 36 258, 44 116 L 56 116 C 49 258, 51 348, 54 440 Z"/>
          <g class="ink-leaves ink-leaves--e">
            <use href="#leaf" transform="translate(51 146) rotate(-36) scale(.88)"/>
            <use href="#leaf" transform="translate(51 155) rotate(10) scale(.76)"/>
          </g>
        </g>
      </g>

      <!-- ── bamboo grove, right cluster ─────────────────────────────── -->
      <g class="ink-bamboo ink-bamboo--right" filter="url(#inkBleed)">
        <g class="ink-culm">
          <path d="M1094 440 C 1088 320, 1086 186, 1098 -10 L 1112 -10 C 1102 186, 1104 320, 1108 440 Z"/>
          <g class="ink-node"><rect x="1090" y="204" width="20" height="3.5" rx="1.75"/><rect x="1092" y="124" width="19" height="3.5" rx="1.75"/><rect x="1095" y="58" width="18" height="3.5" rx="1.75"/></g>
          <g class="ink-leaves ink-leaves--f">
            <use href="#leaf" transform="translate(1098 64) rotate(202) scale(.9)"/>
            <use href="#leaf" transform="translate(1098 73) rotate(164) scale(.78)"/>
            <use href="#leaf" transform="translate(1102 58) rotate(234) scale(.72)"/>
          </g>
          <g class="ink-leaves ink-leaves--g">
            <use href="#leaf" transform="translate(1108 138) rotate(-20) scale(.82)"/>
          </g>
        </g>
        <g class="ink-culm" opacity=".68">
          <path d="M1040 440 C 1036 348, 1034 240, 1044 64 L 1054 64 C 1047 240, 1049 348, 1052 440 Z"/>
          <g class="ink-node"><rect x="1036" y="236" width="16" height="3" rx="1.5"/><rect x="1038" y="154" width="15" height="3" rx="1.5"/></g>
          <g class="ink-leaves ink-leaves--h">
            <use href="#leaf" transform="translate(1043 96) rotate(214) scale(.78)"/>
            <use href="#leaf" transform="translate(1043 105) rotate(176) scale(.68)"/>
          </g>
        </g>
        <g class="ink-culm" opacity=".8">
          <path d="M1152 440 C 1148 356, 1146 272, 1154 140 L 1166 140 C 1159 272, 1161 356, 1164 440 Z"/>
          <g class="ink-leaves ink-leaves--i">
            <use href="#leaf" transform="translate(1152 170) rotate(200) scale(.86)"/>
            <use href="#leaf" transform="translate(1152 179) rotate(160) scale(.74)"/>
          </g>
        </g>
      </g>

      <!-- ── the raft, poled downstream ──────────────────────────────── -->
      <g class="ink-raft-drift">
        <g class="ink-raft-bob" filter="url(#inkBleed)">
          <!-- reflection sits under the raft -->
          <g class="ink-raft__reflection">
            <rect x="456" y="330" width="176" height="2.5" rx="1.25"/>
            <rect x="472" y="337" width="136" height="2" rx="1"/>
          </g>
          <!-- bamboo deck: lashed poles -->
          <g class="ink-raft__deck">
            <rect x="452" y="314" width="184" height="6" rx="3"/>
            <rect x="458" y="308" width="172" height="5" rx="2.5"/>
            <rect x="466" y="303" width="156" height="4.5" rx="2.25"/>
            <rect x="488" y="300" width="2.6" height="22" rx="1.3" opacity=".5"/>
            <rect x="596" y="300" width="2.6" height="22" rx="1.3" opacity=".5"/>
          </g>
          <!-- the figure: conical hat (斗笠), robe, and punting pole -->
          <g class="ink-figure">
            <path class="ink-figure__pole" d="M578 236 L 478 352" stroke-width="3.4" stroke-linecap="round" fill="none"/>
            <path class="ink-figure__robe" d="M548 256 C 539 280, 536 300, 538 303 L 572 303 C 572 288, 568 276, 561 256 Z"/>
            <path class="ink-figure__arm" d="M556 262 C 566 257, 573 249, 578 242 L 583 249 C 576 257, 566 267, 558 271 Z"/>
            <circle class="ink-figure__head" cx="553" cy="250" r="6"/>
            <path class="ink-figure__hat" d="M527 245 C 534 225, 543 213, 553 210 C 563 213, 572 225, 579 245 C 563 250, 543 250, 527 245 Z"/>
            <path class="ink-figure__hat-brim" d="M521 245 C 538 254, 568 254, 585 245 C 568 241, 538 241, 521 245 Z"/>
          </g>
        </g>
        <!-- wake trailing the raft -->
        <g class="ink-wake" filter="url(#inkBleed)">
          <path class="ink-wake__line ink-wake__line--1" d="M428 330 C 396 334, 364 330, 334 335"/>
          <path class="ink-wake__line ink-wake__line--2" d="M438 342 C 400 347, 356 342, 314 348"/>
        </g>
      </g>

      <!-- a few stray strokes: birds far off -->
      <g class="ink-birds" filter="url(#inkBleed)">
        <path class="ink-bird ink-bird--1" d="M742 74 q 6 -5 12 0 M 754 74 q 6 -5 12 0" fill="none" stroke-width="2.2" stroke-linecap="round"/>
        <path class="ink-bird ink-bird--2" d="M802 96 q 5 -4 10 0 M 812 96 q 5 -4 10 0" fill="none" stroke-width="1.9" stroke-linecap="round"/>
      </g>
    </g>
  </svg>
</div>
