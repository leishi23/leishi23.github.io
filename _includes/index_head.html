<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta content="{{ site.description }}" name="description">
  <meta name="keywords" content="{{ site.keywords }}">
  <meta name="author" content="{{ site.author.name }}">
  <title>Lei Shi — Robotics Researcher</title>

  <!-- Open Graph / Twitter -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Lei Shi — Robotics Researcher">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}/">
  <meta property="og:image" content="{{ site.author.avatar | prepend: site.url }}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Lei Shi — Robotics Researcher">
  <meta name="twitter:description" content="{{ site.description }}">
  <meta name="twitter:image" content="{{ site.author.avatar | prepend: site.url }}">

  <!-- favicon -->
  <link rel="shortcut icon" href="{{ "/static/assets/img/letter.ico" | prepend: site.baseurl }}">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- classical serif for the ink scene's inscription and seal (subset to the glyphs used) -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap&text=%E7%AB%B9%E6%B5%81%E6%B8%85%E9%A2%A8%E8%87%AA%E5%9C%A8%E4%B8%80%E7%AF%99%E7%85%99%E6%B0%B4%E7%84%A1%E5%BF%83" rel="stylesheet">

  <!-- Landing styles + interactions -->
  <link href="{{ "/static/css/landing.css" | prepend: site.baseurl }}" rel="stylesheet">
  {% include theme_init.html %}
  <script defer src="{{ "/static/js/theme.js" | prepend: site.baseurl }}"></script>
  <script defer src="{{ "/static/js/landing.js" | prepend: site.baseurl }}"></script>
  <script defer src="{{ "/static/js/ink.js" | prepend: site.baseurl }}"></script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GMDVN35R6T"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-GMDVN35R6T');

</head>
