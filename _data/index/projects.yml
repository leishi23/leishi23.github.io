# projects section data — rendered by _includes/landing/projects.html
# Each project: name, url (paper or repo), img (under /static/assets/img/landing), desc (list of lines)

- name: Dexterous Manipulation (Dynamic Grasping)
  url: https://github.com/leishi23/ICRA2023_Dynamics_Grasping
  img: /static/assets/img/landing/Dynamic_Grasping.gif
  desc:
    - Designed a general dynamic hybrid manipulation strategy for dynamic grasping.
    - Customized a double inverted pendulum model-based algorithm for the UR16e.

- name: Dexterous Manipulation Online Planning
  url: https://github.com/leishi23/DMOP
  img: /static/assets/img/landing/approach.gif
  desc:
    - Comprehensive and robust manipulation of objects.
    - Fast enough to support online computation and replanning.
    - A foundation for manipulation replanning and recovery.

- name: Human-Like Motion Planning Algorithm
  url: https://arxiv.org/abs/2409.10747
  img: /static/assets/img/landing/humanlike.gif
  desc:
    - Analyzed human motion and its underlying mechanism — coordinated movement and compliant movement.
    - Implemented coordinated movement for 2-D translation and rotation.
    - Developed a parametric optimal-control algorithm for the problem.

- name: Rough-Terrain Ground Vehicle Control
  url: https://github.com/leishi23/Rough_terrain_vehicle_control
  img: /static/assets/img/landing/roughterrain.gif
  desc:
    - Built a time-aligned dataset from scratch in CARLA — collecting, transforming and plotting sensor data in real time.
    - Implemented a CNN + LSTM model to predict vehicle motion in urban and arbitrary rough-terrain areas (maps authored in RoadRunner).
    - Used an MPPI-control algorithm to guide motion planning and control.

- name: Optimal Control of the Upper Body in Humanoid Robots
  url: https://arxiv.org/abs/2411.09935
  img: /static/assets/img/landing/humanoid.png
  desc:
    - Derived an analytical bang-bang control solution using variable-damping impedance control to cut lower-limb energy cost from upper-body oscillation, while keeping passively-held objects stable under uncertain lower-limb motion.

- name: Fairness-Oriented Control for Safety-Critical Multi-Robot Systems
  url: https://arxiv.org/abs/2409.10749
  img: /static/assets/img/landing/fairnessori.gif
  desc:
    - Introduced an Alternative Authority Control (AAC) framework for dynamic distribution of control authority among agents.
    - Proposed a Model Predictive Control with Flexible Control Barrier Functions (MPC-FCBF) for stronger dynamic obstacle avoidance.
    - Combined AAC and MPC-FCBF into a hierarchical architecture for efficient authority allocation and obstacle avoidance.
